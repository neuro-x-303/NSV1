<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NSV1 Model Predictor</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.2.0/dist/tf.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background: #111;
      color: #0ff;
      font-family: 'Courier New', Courier, monospace;
      text-align: center;
      padding: 20px;
      margin: 0;
    }
    h1 {
      font-size: 2em;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }
    .canvas-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      border: 2px solid #0ff;
      background: #000;
      touch-action: none;
      max-width: 100%;
      height: auto;
    }
    #output-canvas {
      background: #fff;
      color: #000;
    }
    button {
      padding: 10px 20px;
      font-size: 18px;
      border: none;
      cursor: pointer;
      margin: 5px;
    }
    #predict-btn {
      background: #0ff;
      color: #000;
    }
    #predict-btn:disabled {
      background: #044;
      color: #033;
      cursor: not-allowed;
    }
    #clear-btn {
      background: #555;
      color: #eee;
    }
    #status {
      margin-top: 10px;
      font-weight: bold;
    }
    #output {
      margin-top: 15px;
      font-size: 22px;
      min-height: 30px;
      color: #0f0;
      font-weight: bold;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>
  <h1>NSV1 Digit Predictor</h1>
  <div class="container">
    <div class="canvas-container">
      <canvas id="canvas" width="280" height="280"></canvas>
      <button id="predict-btn" disabled>Predict</button>
      <button id="clear-btn">Clear</button>
    </div>
    <div class="canvas-container">
      <canvas id="output-canvas" width="280" height="280"></canvas>
    </div>
  </div>
  <div id="status">Loading model, please wait...</div>
  <div id="output"></div>

<script>
  let model;
  const status = document.getElementById('status');
  const output = document.getElementById('output');
  const predictBtn = document.getElementById('predict-btn');
  const clearBtn = document.getElementById('clear-btn');

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  const outCanvas = document.getElementById('output-canvas');
  const outCtx = outCanvas.getContext('2d');

  let drawing = false;

  // Initial fill
  ctx.fillStyle = 'black';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  outCtx.fillStyle = 'white';
  outCtx.fillRect(0, 0, outCanvas.width, outCanvas.height);

  canvas.addEventListener('mousedown', () => drawing = true);
  canvas.addEventListener('mouseup', () => { drawing = false; ctx.beginPath(); });
  canvas.addEventListener('mouseout', () => { drawing = false; ctx.beginPath(); });
  canvas.addEventListener('mousemove', draw);

  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); drawing = true; });
  canvas.addEventListener('touchend', (e) => { e.preventDefault(); drawing = false; ctx.beginPath(); });
  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (!drawing) return;
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches[0];
    draw({clientX: touch.clientX, clientY: touch.clientY});
  });

  function draw(e) {
    if (!drawing) return;
    ctx.lineWidth = 20;
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'white';

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y);
  }

  clearBtn.addEventListener('click', () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = 'black';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    outCtx.clearRect(0, 0, outCanvas.width, outCanvas.height);
    outCtx.fillStyle = 'white';
    outCtx.fillRect(0, 0, outCanvas.width, outCanvas.height);
    output.textContent = '';
  });

  async function loadModel() {
    try {
      status.textContent = 'Loading model...';
      model = await tf.loadLayersModel('model/model.json');
      status.textContent = 'Model loaded successfully!';
      predictBtn.disabled = false;
    } catch (error) {
      console.error('Error loading model:', error);
      status.textContent = 'Failed to load model. Check console.';
    }
  }

  async function predict() {
    if (!model) return alert('Model not loaded yet!');

    const tmpCanvas = document.createElement('canvas');
    tmpCanvas.width = 128;
    tmpCanvas.height = 128;
    const tmpCtx = tmpCanvas.getContext('2d');
    tmpCtx.drawImage(canvas, 0, 0, 128, 128);

    const imageData = tmpCtx.getImageData(0, 0, 128, 128);
    const { data } = imageData;
    const input = [];

    for (let i = 0; i < data.length; i += 4) {
      const r = data[i];
      const g = data[i + 1];
      const b = data[i + 2];
      const gray = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      input.push(gray);
    }

    const tensor = tf.tensor(input, [1, 128, 128, 1]);

    const prediction = model.predict(tensor);
    const probabilities = await prediction.data();
    const predictedIndex = prediction.argMax(1).dataSync()[0];

    const messages = [
      `Keni: Yahh! I got it, you have drawn ${predictedIndex}!`,
      `Keni: I'm sure it's a ${predictedIndex}!`,
      `Keni: That's clearly a ${predictedIndex}!`,
      `Keni: The number looks like ${predictedIndex}!`,
      `Keni: Without a doubt, it's ${predictedIndex}!`
    ];

    const message = messages[Math.floor(Math.random() * messages.length)];
    output.textContent = '';
    let i = 0;

    function typeWriter() {
      if (i < message.length) {
        output.textContent += message.charAt(i);
        i++;
        setTimeout(typeWriter, 40);
      }
    }
    typeWriter();

    // Render predicted number on white canvas
    outCtx.clearRect(0, 0, outCanvas.width, outCanvas.height);
    outCtx.fillStyle = 'white';
    outCtx.fillRect(0, 0, outCanvas.width, outCanvas.height);
    outCtx.fillStyle = 'black';
    outCtx.font = 'bold 200px Arial';
    outCtx.textAlign = 'center';
    outCtx.textBaseline = 'middle';
    outCtx.fillText(predictedIndex, outCanvas.width / 2, outCanvas.height / 2);

    tensor.dispose();
    prediction.dispose();
  }

  predictBtn.addEventListener('click', predict);
  loadModel();
</script>
</body>
</html>
